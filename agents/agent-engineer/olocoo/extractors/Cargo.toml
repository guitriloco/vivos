[package]
name = "shadow_infiltrator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shadow_infiltrator"
path = "shadow_infiltrator.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zenith_core = { path = "../core" }
futures = "0.3"
