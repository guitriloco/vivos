syntax = "proto3";

package neuralbridge;

service NeuralBridge {
  rpc SendTelemetry (TelemetryData) returns (Acknowledgement) {}
  rpc ExchangeMutation (MutationData) returns (MutationData) {}
  rpc GetNodeStatus (NodeRequest) returns (NodeStatus) {}
}

message TelemetryData {
  string node_id = 1;
  float cpu_usage = 2;
  float ram_usage = 3;
  float gpu_usage = 4;
  float gpu_temp = 5;
  float arbitrage_profit = 6;
  string status = 7;
  double timestamp = 8;
}

message MutationData {
  string node_id = 1;
  string payload = 2;
  string mutation_type = 3;
}

message NodeRequest {
  string node_id = 1;
}

message NodeStatus {
  string node_id = 1;
  string status = 2;
  double uptime = 3;
}

message Acknowledgement {
  bool success = 1;
  string message = 2;
}
